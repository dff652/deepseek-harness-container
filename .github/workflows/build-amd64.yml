name: build-amd64-candidate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-amd64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      IMAGE_TAG: local/dsh:0.1.1-rc.2-amd64
      CADDY_REF: caddy:2.11.4@sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a
      CADDY_ARCHIVE_TAG: caddy:dsh-offline-2.11.4-amd64-98eb57d882cc
      HAPROXY_REF: haproxy:3.4.3-alpine3.24@sha256:c7f5037a567378929d0aba734eb78b73497209c72456519420ce5e68a42d60ac
      HAPROXY_ARCHIVE_TAG: haproxy:dsh-offline-3.4.3-amd64-c7f5037a5673
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Run static contracts
        run: |
          python3 scripts/check-release-inputs.py
          bash tests/release-inputs-contract.sh
          bash tests/native-arm64-candidate-contract.sh
          bash tests/compose-contract.sh
          bash tests/negative-exposure.sh
          bash tests/amd64-compose-contract.sh
          bash tests/amd64-workflow-contract.sh
          bash tests/caddy-volume-init.sh
          python3 -m unittest tests/supply-chain-policy.py

      - name: Enforce source and clean checkout
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"

      - name: Record and enforce native-runner disk preflight
        run: |
          test "$(uname -m)" = x86_64
          df -h / | tee "${RUNNER_TEMP}/disk-before.txt"
          docker system df | tee "${RUNNER_TEMP}/docker-system-df-before.txt"
          available_kib=$(df --output=avail / | tail -n 1 | tr -d ' ')
          test "$available_kib" -ge 6291456

      - name: Build native AMD64 Docker archive
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64
          target: runtime
          build-args: |
            TARGETPLATFORM=linux/amd64
            NODE_BASE_REF=node:24.19.0-bookworm-slim@sha256:65932751ed4073ed02f5c04e494e4b2572a891b7dbea0568a863dc80341bf848
            NODE_RUNTIME_REF=gcr.io/distroless/nodejs24-debian13@sha256:579735ae8373ff1ab6c4aa251480fd17ae6ec1b7f83b1bfc76bf6003d0fb242b
          tags: ${{ env.IMAGE_TAG }}
          outputs: type=docker,dest=${{ runner.temp }}/dsh-0.1.1-rc.2-amd64.tar
          provenance: false
          sbom: false

      - name: Load and smoke the AMD64 image
        run: |
          docker load --input "${RUNNER_TEMP}/dsh-0.1.1-rc.2-amd64.tar"
          test "$(docker image inspect "$IMAGE_TAG" --format '{{.Architecture}}')" = amd64
          docker run --rm "$IMAGE_TAG" --version
          bash tests/amd64-runtime.sh "$IMAGE_TAG"
          DSH_IMAGE="$IMAGE_TAG" bash tests/rc2-regression.sh
          bash tests/runtime-cve-reachability.sh
          scripts/audit-loaded-runtime-cve.sh "$IMAGE_TAG" linux/amd64 \
            "${RUNNER_TEMP}/runtime-cve-reachability.json" collect
          docker image inspect "$IMAGE_TAG" > "${RUNNER_TEMP}/dsh-image-inspect.json"
          docker version > "${RUNNER_TEMP}/docker-version.txt"
          docker buildx version > "${RUNNER_TEMP}/buildx-version.txt"
          docker buildx inspect > "${RUNNER_TEMP}/builder-inspect.txt"
          du -h "${RUNNER_TEMP}/dsh-0.1.1-rc.2-amd64.tar" | tee "${RUNNER_TEMP}/archive-size.txt"
          df -h / | tee "${RUNNER_TEMP}/disk-after.txt"

      - name: Run isolated non-publishing HAProxy PoC
        run: |
          docker pull --platform linux/amd64 "$HAPROXY_REF"
          SOURCE_IMAGE="$HAPROXY_REF" SOURCE_PLATFORM=linux/amd64 \
            ARCHIVE_TAG="$HAPROXY_ARCHIVE_TAG" CLEAN_LOAD_REQUIRED=1 KEEP_ARCHIVE_TAG=1 \
            bash tests/offline-image-archive.sh
          docker pull --platform linux/amd64 "$CADDY_REF"
          SOURCE_IMAGE="$CADDY_REF" SOURCE_PLATFORM=linux/amd64 \
            ARCHIVE_TAG="$CADDY_ARCHIVE_TAG" CLEAN_LOAD_REQUIRED=1 KEEP_ARCHIVE_TAG=1 \
            bash tests/offline-image-archive.sh
          CONTRACT_DSH_IMAGE="$IMAGE_TAG" \
            CONTRACT_PLATFORM=linux/amd64 \
            CONTRACT_HAPROXY_IMAGE="$HAPROXY_ARCHIVE_TAG" \
            bash tests/haproxy-contract.sh
          HAPROXY_IMAGE="$HAPROXY_ARCHIVE_TAG" \
            HAPROXY_PLATFORM=linux/amd64 \
            BACKEND_IMAGE="$IMAGE_TAG" \
            BACKEND_PLATFORM=linux/amd64 \
            bash tests/haproxy-runtime.sh
          DSH_IMAGE="$IMAGE_TAG" \
            DSH_PLATFORM=linux/amd64 \
            HAPROXY_IMAGE="$HAPROXY_ARCHIVE_TAG" \
            bash tests/haproxy-compose-runtime.sh

      - name: Assemble manual-download bundle
        if: github.event_name == 'workflow_dispatch'
        run: |
          install -d -m 0755 "${RUNNER_TEMP}/bundle"
          docker pull --platform linux/amd64 "$CADDY_REF"
          test "$(docker image inspect "$CADDY_REF" --format '{{.Architecture}}')" = amd64
          docker image inspect "$CADDY_REF" > "${RUNNER_TEMP}/caddy-image-inspect.json"
          scripts/save-pinned-image.sh "$CADDY_REF" linux/amd64 \
            "$CADDY_ARCHIVE_TAG" "${RUNNER_TEMP}/bundle/caddy-2.11.4-amd64.tar"
          cp "${RUNNER_TEMP}/dsh-0.1.1-rc.2-amd64.tar" "${RUNNER_TEMP}/bundle/"
          cp compose.yaml compose.amd64.yaml Caddyfile "${RUNNER_TEMP}/bundle/"
          cp .env.amd64.example "${RUNNER_TEMP}/bundle/.env.example"
          cp "${RUNNER_TEMP}/dsh-image-inspect.json" \
            "${RUNNER_TEMP}/caddy-image-inspect.json" \
            "${RUNNER_TEMP}/docker-version.txt" \
            "${RUNNER_TEMP}/buildx-version.txt" \
            "${RUNNER_TEMP}/builder-inspect.txt" \
            "${RUNNER_TEMP}/archive-size.txt" \
            "${RUNNER_TEMP}/disk-before.txt" \
            "${RUNNER_TEMP}/disk-after.txt" \
            "${RUNNER_TEMP}/docker-system-df-before.txt" \
            "${RUNNER_TEMP}/runtime-cve-reachability.json" \
            "${RUNNER_TEMP}/bundle/"
          built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          dsh_image_id=$(docker image inspect "$IMAGE_TAG" --format '{{.Id}}')
          caddy_image_id=$(docker image inspect "$CADDY_REF" --format '{{.Id}}')
          dsh_archive_sha256=$(sha256sum "${RUNNER_TEMP}/bundle/dsh-0.1.1-rc.2-amd64.tar" | cut -d' ' -f1)
          caddy_archive_sha256=$(sha256sum "${RUNNER_TEMP}/bundle/caddy-2.11.4-amd64.tar" | cut -d' ' -f1)
          config_path=$(tar -xOf "${RUNNER_TEMP}/bundle/dsh-0.1.1-rc.2-amd64.tar" manifest.json | jq -er '.[0].Config')
          case "$config_path" in blobs/sha256/*) ;; *) echo "unexpected OCI config path: $config_path" >&2; exit 1;; esac
          config_digest="sha256:${config_path##*/}"
          test "$(tar -xOf "${RUNNER_TEMP}/bundle/dsh-0.1.1-rc.2-amd64.tar" "$config_path" | sha256sum | cut -d' ' -f1)" = \
            "${config_digest#sha256:}"
          manifest_digest=$(tar -xOf "${RUNNER_TEMP}/bundle/dsh-0.1.1-rc.2-amd64.tar" index.json | jq -er '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")]
            | if length == 1 then .[0].digest else error("expected exactly one Linux AMD64 manifest") end
          ')
          manifest_path="blobs/sha256/${manifest_digest#sha256:}"
          test "$(tar -xOf "${RUNNER_TEMP}/bundle/dsh-0.1.1-rc.2-amd64.tar" "$manifest_path" | sha256sum | cut -d' ' -f1)" = \
            "${manifest_digest#sha256:}"
          test "$(tar -xOf "${RUNNER_TEMP}/bundle/dsh-0.1.1-rc.2-amd64.tar" "$manifest_path" | jq -er '.config.digest')" = \
            "$config_digest"
          jq \
            --arg builtAt "$built_at" \
            --arg sourceCommit "${{ github.sha }}" \
            --arg githubRunId "${{ github.run_id }}" \
            --arg imageId "$dsh_image_id" \
            --arg manifestDigest "$manifest_digest" \
            --arg configDigest "$config_digest" \
            --arg dshArchiveSha256 "$dsh_archive_sha256" \
            --arg caddyImageId "$caddy_image_id" \
            --arg caddyArchiveSha256 "$caddy_archive_sha256" \
            'del(.images.binfmt, .images.arm64Probe)
             | del(
                 .images.nodeBaseArm64,
                 .images.nodeRuntimeArm64,
                 .images.caddyArm64
               )
             | .status = "native-github-candidate-built-not-released"
             | .target = "linux/amd64"
             | .images.nodeBaseAmd64 = "docker.io/library/node:24.19.0-bookworm-slim@sha256:65932751ed4073ed02f5c04e494e4b2572a891b7dbea0568a863dc80341bf848"
             | .images.nodeRuntimeAmd64 = "gcr.io/distroless/nodejs24-debian13@sha256:579735ae8373ff1ab6c4aa251480fd17ae6ec1b7f83b1bfc76bf6003d0fb242b"
             | .images.caddyAmd64 = "docker.io/library/caddy:2.11.4@sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a"
             | .output = {
                 buildEnvironment: "github-actions/ubuntu-24.04-amd64-native-buildx",
                 builtAt: $builtAt,
                 sourceCommit: $sourceCommit,
                 githubRunId: $githubRunId,
                 imageId: $imageId,
                 manifestDigest: $manifestDigest,
                 configDigest: $configDigest,
                 dshArchiveSha256: $dshArchiveSha256,
                 caddyImageId: $caddyImageId,
                 caddyArchiveSha256: $caddyArchiveSha256,
                 dockerVersionEvidence: "docker-version.txt",
                 buildxVersionEvidence: "buildx-version.txt",
                 builderInspectEvidence: "builder-inspect.txt",
                 diskBeforeEvidence: "disk-before.txt",
                 diskAfterEvidence: "disk-after.txt",
                 dockerSystemDfBeforeEvidence: "docker-system-df-before.txt",
                 sbomSha256: null,
                 provenanceSha256: null
               }' \
            policy/image-lock.json > "${RUNNER_TEMP}/bundle/native-candidate-lock.json"
          printf '%s\n' \
            'CANDIDATE ONLY: native AMD64 build; no SBOM, provenance, signature or production acceptance is included.' \
            > "${RUNNER_TEMP}/bundle/CANDIDATE-NOT-RELEASE.txt"
          docker system df > "${RUNNER_TEMP}/bundle/docker-system-df.txt"
          (
            cd "${RUNNER_TEMP}/bundle"
            sha256sum -- .env.example * > SHA256SUMS
          )
          tar -C "${RUNNER_TEMP}" -cf "${RUNNER_TEMP}/dsh-container-amd64.tar" bundle

      - name: Upload manual candidate
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsh-container-amd64-${{ github.sha }}
          path: ${{ runner.temp }}/dsh-container-amd64.tar
          retention-days: 14
