name: publish-dockerhub-candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-candidate to publish architecture and manifest candidate tags
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPOSITORY: dff652/deepseek-harness-container
  CANDIDATE_VERSION: 0.1.1-rc.1

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-candidate'
    strategy:
      fail-fast: true
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            uname: x86_64
            node_base_ref: node:24.19.0-bookworm-slim@sha256:65932751ed4073ed02f5c04e494e4b2572a891b7dbea0568a863dc80341bf848
            local_tag: local/dsh:0.1.1-rc.1-amd64
            runtime_test: tests/amd64-runtime.sh
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            uname: aarch64
            node_base_ref: node:24.19.0-bookworm-slim@sha256:c133efe216ffb6e785ed9a8be55a29fcb86775e8008ae0a9f0ed6af4f175bb03
            local_tag: local/dsh:0.1.1-rc.1-arm64
            runtime_test: tests/arm64-runtime.sh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Enforce native runner and repository contracts
        run: |
          test "$(uname -m)" = '${{ matrix.uname }}'
          bash tests/compose-contract.sh
          bash tests/negative-exposure.sh
          bash tests/dockerhub-workflow-contract.sh

      - name: Build and smoke native candidate
        run: |
          docker buildx build \
            --platform '${{ matrix.platform }}' \
            --target runtime \
            --build-arg 'TARGETPLATFORM=${{ matrix.platform }}' \
            --build-arg 'NODE_BASE_REF=${{ matrix.node_base_ref }}' \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag '${{ matrix.local_tag }}' \
            --load \
            .
          bash '${{ matrix.runtime_test }}' '${{ matrix.local_tag }}'

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push architecture candidate
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          LOCAL_TAG: ${{ matrix.local_tag }}
        run: |
          remote_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-${ARCHITECTURE}-candidate"
          docker tag "$LOCAL_TAG" "$remote_tag"
          docker push "$remote_tag"
          docker buildx imagetools inspect "$remote_tag"

  publish-manifest:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-candidate'
    needs: build-and-push
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify dual-architecture candidate manifest
        run: |
          amd64_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-amd64-candidate"
          arm64_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-arm64-candidate"
          manifest_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-candidate"
          docker buildx imagetools create \
            --tag "$manifest_tag" \
            "$amd64_tag" \
            "$arm64_tag"
          docker buildx imagetools inspect --raw "$manifest_tag" > manifest.json
          jq -e '
            [.manifests[].platform | select(.os == "linux") | .architecture]
            | sort == ["amd64", "arm64"]
          ' manifest.json
          docker buildx imagetools inspect "$manifest_tag"
