name: publish-dockerhub-candidate

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-candidate to publish immutable architecture and manifest candidate tags
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dockerhub-candidate-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_REPOSITORY: dff652/deepseek-harness-container
  CANDIDATE_VERSION: 0.1.1-rc.1
  DSH_VERSION: 0.1.1-rc.1
  CADDY_VERSION: 2.11.4
  SYFT_VERSION: 1.51.0
  GRYPE_VERSION: 0.117.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out complete source history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Enforce source and repository contracts
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          bash tests/compose-contract.sh
          bash tests/negative-exposure.sh
          bash tests/dockerhub-workflow-contract.sh
          python3 -m unittest tests/supply-chain-policy.py

      - name: Scan complete Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
          GITLEAKS_VERSION: ${{ env.GITLEAKS_VERSION }}

  build-and-package:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-candidate'
    needs: preflight
    strategy:
      # Complete both scans so an AMD64 failure does not erase the ARM64
      # evidence (or vice versa). The dependent publication job still requires
      # the entire matrix to pass.
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            platform: linux/amd64
            uname: x86_64
            node_base_ref: node:24.19.0-bookworm-slim@sha256:65932751ed4073ed02f5c04e494e4b2572a891b7dbea0568a863dc80341bf848
            node_base_digest: sha256:65932751ed4073ed02f5c04e494e4b2572a891b7dbea0568a863dc80341bf848
            caddy_ref: caddy:2.11.4@sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a
            caddy_digest: sha256:98eb57d882ccd5213d1688764db10c1ca2c58a1ca3a6717a3411ad798f7a423a
            runtime_test: tests/amd64-runtime.sh
          - architecture: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            uname: aarch64
            node_base_ref: node:24.19.0-bookworm-slim@sha256:c133efe216ffb6e785ed9a8be55a29fcb86775e8008ae0a9f0ed6af4f175bb03
            node_base_digest: sha256:c133efe216ffb6e785ed9a8be55a29fcb86775e8008ae0a9f0ed6af4f175bb03
            caddy_ref: caddy:2.11.4@sha256:1172d4213087d3fc30bafc7ff2c2896180eb0c41ff7f75f315568fb36cabdcba
            caddy_digest: sha256:1172d4213087d3fc30bafc7ff2c2896180eb0c41ff7f75f315568fb36cabdcba
            runtime_test: tests/arm64-runtime.sh
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      LOCAL_TAG: local/dsh:${{ github.sha }}-${{ matrix.architecture }}
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Enforce native runner and clean source
        run: |
          test "$(uname -m)" = '${{ matrix.uname }}'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          install -d -m 0755 evidence candidate

      - name: Build and smoke native DSH candidate
        env:
          BUILDX_METADATA_PROVENANCE: max
        run: |
          docker buildx build \
            --platform '${{ matrix.platform }}' \
            --target runtime \
            --build-arg 'TARGETPLATFORM=${{ matrix.platform }}' \
            --build-arg 'NODE_BASE_REF=${{ matrix.node_base_ref }}' \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "$LOCAL_TAG" \
            --metadata-file evidence/dsh-build-metadata.json \
            --load \
            .
          bash '${{ matrix.runtime_test }}' "$LOCAL_TAG"
          docker image inspect "$LOCAL_TAG" > evidence/dsh-image-inspect.json

      - name: Resolve exact Caddy child image
        run: |
          docker pull --platform '${{ matrix.platform }}' '${{ matrix.caddy_ref }}'
          test "$(docker image inspect '${{ matrix.caddy_ref }}' --format '{{.Os}}/{{.Architecture}}')" = '${{ matrix.platform }}'
          docker image inspect '${{ matrix.caddy_ref }}' > evidence/caddy-image-inspect.json

      - name: Download pinned Syft
        id: syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          syft-version: v${{ env.SYFT_VERSION }}

      - name: Generate DSH and Caddy SBOMs from actual images
        env:
          SYFT_CMD: ${{ steps.syft.outputs.cmd }}
          SYFT_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          "$SYFT_CMD" scan "$LOCAL_TAG" \
            -o syft-json=evidence/dsh-sbom.syft.json \
            -o cyclonedx-json=evidence/dsh-sbom.cdx.json
          "$SYFT_CMD" scan '${{ matrix.caddy_ref }}' \
            -o syft-json=evidence/caddy-sbom.syft.json \
            -o cyclonedx-json=evidence/caddy-sbom.cdx.json
          "$SYFT_CMD" version > evidence/syft-version.txt

      - name: Download pinned Grype
        id: grype
        uses: anchore/scan-action/download-grype@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          grype-version: v${{ env.GRYPE_VERSION }}
          cache-db: true

      - name: Scan the exact SBOMs
        env:
          GRYPE_CMD: ${{ steps.grype.outputs.cmd }}
          GRYPE_CHECK_FOR_APP_UPDATE: 'false'
        run: |
          "$GRYPE_CMD" sbom:evidence/dsh-sbom.syft.json \
            -o json --file evidence/dsh-vulnerabilities.json
          "$GRYPE_CMD" sbom:evidence/caddy-sbom.syft.json \
            -o json --file evidence/caddy-vulnerabilities.json
          "$GRYPE_CMD" version > evidence/grype-version.txt

      - name: Enforce source, license and vulnerability policies
        run: |
          scripts/check-supply-chain-policy.py \
            --dsh-sbom evidence/dsh-sbom.syft.json \
            --caddy-sbom evidence/caddy-sbom.syft.json \
            --dsh-vulnerabilities evidence/dsh-vulnerabilities.json \
            --caddy-vulnerabilities evidence/caddy-vulnerabilities.json \
            --build-metadata evidence/dsh-build-metadata.json \
            --dsh-inspect evidence/dsh-image-inspect.json \
            --caddy-inspect evidence/caddy-image-inspect.json \
            --license-policy policy/license-policy.json \
            --vulnerability-policy policy/vulnerability-allowlist.json \
            --tools-policy policy/supply-chain-tools.json \
            --architecture '${{ matrix.architecture }}' \
            --platform '${{ matrix.platform }}' \
            --dsh-version "$DSH_VERSION" \
            --caddy-version "$CADDY_VERSION" \
            --node-base-digest '${{ matrix.node_base_digest }}' \
            --caddy-digest '${{ matrix.caddy_digest }}' \
            --source-revision "$GITHUB_SHA" \
            --output evidence/policy-summary.json

      - name: Package policy-approved local image
        run: |
          docker image save "$LOCAL_TAG" | gzip -1 > 'candidate/dsh-${{ matrix.architecture }}.tar.gz'
          (
            cd candidate
            sha256sum 'dsh-${{ matrix.architecture }}.tar.gz' > SHA256SUMS
          )
          cp candidate/SHA256SUMS evidence/image-archive.sha256
          printf '%s\n' "$LOCAL_TAG" > candidate/image-tag.txt

      - name: Upload policy-approved image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.architecture }}-${{ github.sha }}
          path: candidate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Finalize evidence hashes
        if: always()
        run: |
          if test -d evidence; then
            cp Dockerfile runtime/package.json runtime/pnpm-lock.yaml \
              policy/license-policy.json policy/vulnerability-allowlist.json \
              policy/supply-chain-tools.json evidence/
            git rev-parse HEAD > evidence/source-commit.txt
            docker version > evidence/docker-version.txt
            docker buildx version > evidence/buildx-version.txt
            (
              cd evidence
              checksum_file=$(mktemp)
              find . -type f ! -name SHA256SUMS -print0 \
                | LC_ALL=C sort -z \
                | xargs -0 sha256sum > "$checksum_file"
              mv "$checksum_file" SHA256SUMS
            )
          fi

      - name: Upload architecture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-${{ matrix.architecture }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  publish-manifest:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'publish-candidate'
    needs: build-and-package
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver-opts: image=moby/buildkit:v0.29.0@sha256:0039c1d47e8748b5afea56f4e85f14febaf34452bd99d9552d2daa82262b5cc5

      - name: Download policy-approved images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: candidate-*-${{ github.sha }}
          path: candidates

      - name: Load and verify policy-approved images
        run: |
          gzip -dc "candidates/candidate-amd64-${GITHUB_SHA}/dsh-amd64.tar.gz" | docker image load
          gzip -dc "candidates/candidate-arm64-${GITHUB_SHA}/dsh-arm64.tar.gz" | docker image load
          for architecture in amd64 arm64; do
            local_tag=$(<"candidates/candidate-${architecture}-${GITHUB_SHA}/image-tag.txt")
            test "$local_tag" = "local/dsh:${GITHUB_SHA}-${architecture}"
            test "$(docker image inspect "$local_tag" --format '{{.Os}}/{{.Architecture}}')" = "linux/${architecture}"
            test "$(docker image inspect "$local_tag" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          done

      - name: Log in to Docker Hub only after all gates pass
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Refuse replacement of immutable candidate tags
        run: |
          install -d -m 0755 publication-evidence
          for suffix in amd64-candidate arm64-candidate candidate; do
            tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-${suffix}"
            error_file="publication-evidence/preflight-${suffix}.err"
            if docker buildx imagetools inspect "$tag" \
              > "publication-evidence/preflight-${suffix}.txt" 2> "$error_file"; then
              echo "Refusing to replace existing candidate tag: $tag" >&2
              exit 1
            fi
            if ! grep -Eq ': not found$|manifest unknown' "$error_file"; then
              echo "Registry preflight failed without a definitive not-found response: $tag" >&2
              cat "$error_file" >&2
              exit 1
            fi
          done

      - name: Push architecture candidates and capture immutable digests
        run: |
          for architecture in amd64 arm64; do
            local_tag=$(<"candidates/candidate-${architecture}-${GITHUB_SHA}/image-tag.txt")
            remote_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-${architecture}-candidate"
            docker tag "$local_tag" "$remote_tag"
            docker push "$remote_tag" > "publication-evidence/push-${architecture}.log"
            docker buildx imagetools inspect "$remote_tag" --format '{{json .Manifest}}' \
              > "publication-evidence/${architecture}-manifest.json"
            docker buildx imagetools inspect "$remote_tag" --format '{{json .Image}}' \
              > "publication-evidence/${architecture}-image.json"
            jq -e --arg architecture "$architecture" --arg revision "$GITHUB_SHA" '
              .os == "linux"
              and .architecture == $architecture
              and .config.Labels["org.opencontainers.image.revision"] == $revision
            ' "publication-evidence/${architecture}-image.json"
          done

      - name: Publish and verify dual-architecture candidate manifest
        run: |
          amd64_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-amd64-candidate"
          arm64_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-arm64-candidate"
          manifest_tag="${DOCKERHUB_REPOSITORY}:${CANDIDATE_VERSION}-candidate"
          amd64_digest=$(jq -er .digest publication-evidence/amd64-manifest.json)
          arm64_digest=$(jq -er .digest publication-evidence/arm64-manifest.json)
          docker buildx imagetools create \
            --tag "$manifest_tag" \
            "${amd64_tag}@${amd64_digest}" \
            "${arm64_tag}@${arm64_digest}"
          docker buildx imagetools inspect --raw "$manifest_tag" \
            > publication-evidence/candidate-index.json
          jq -e --arg amd64 "$amd64_digest" --arg arm64 "$arm64_digest" '
            (.manifests | length) == 2
            and any(.manifests[]; .digest == $amd64 and .platform.os == "linux" and .platform.architecture == "amd64")
            and any(.manifests[]; .digest == $arm64 and .platform.os == "linux" and .platform.architecture == "arm64")
          ' publication-evidence/candidate-index.json
          docker buildx imagetools inspect "$manifest_tag" \
            > publication-evidence/candidate-index.txt
          (
            cd publication-evidence
            checksum_file=$(mktemp)
            find . -type f ! -name SHA256SUMS -print0 \
              | LC_ALL=C sort -z \
              | xargs -0 sha256sum > "$checksum_file"
            mv "$checksum_file" SHA256SUMS
          )

      - name: Upload registry publication evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dockerhub-publication-${{ github.sha }}
          path: publication-evidence/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 30
